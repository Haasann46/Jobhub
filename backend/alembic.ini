# Конфигурация Alembic — инструмента для управления миграциями БД
# Alembic отслеживает изменения в моделях и создаёт SQL-скрипты

[alembic]
# Путь к папке с миграциями
script_location = alembic

# URL берётся из переменной окружения (не хардкодим пароль!)
# Это переопределяется в env.py

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
